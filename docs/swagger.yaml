basePath: /
definitions:
  domain.ColumnSchemaType:
    properties:
      column:
        type: string
      type:
        enum:
        - float
        - int
        - bool
        - string
        type: string
    required:
    - column
    - type
    type: object
  domain.Device:
    properties:
      code:
        type: string
      created_at:
        type: string
      device_type:
        $ref: '#/definitions/domain.DeviceType'
      id:
        type: string
      room:
        $ref: '#/definitions/domain.Room'
    type: object
  domain.DeviceRequest:
    properties:
      code:
        maxLength: 50
        type: string
      device_type_id:
        type: string
      room_id:
        type: string
    required:
    - code
    - device_type_id
    type: object
  domain.DeviceType:
    properties:
      code:
        type: string
      description:
        type: string
      id:
        type: string
      topic:
        type: string
    type: object
  domain.DeviceTypeRequest:
    properties:
      code:
        type: string
      description:
        type: string
      topic:
        maxLength: 50
        type: string
    required:
    - code
    - topic
    type: object
  domain.Room:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  domain.RoomRequest:
    properties:
      name:
        type: string
    type: object
  domain.SensorType:
    properties:
      code:
        type: string
      column_schema:
        additionalProperties:
          $ref: '#/definitions/domain.ColumnSchemaType'
        type: object
      description:
        type: string
      id:
        type: string
      payload_format:
        type: string
      qos_mqtt:
        type: integer
      readings_table_name:
        type: string
      topic:
        type: string
      value_mapping:
        type: object
    type: object
  domain.SensorTypeRequest:
    properties:
      code:
        type: string
      column_schema:
        additionalProperties:
          $ref: '#/definitions/domain.ColumnSchemaType'
        type: object
      description:
        type: string
      payload_format:
        enum:
        - json
        - raw
        type: string
      qos_mqtt:
        maximum: 2
        minimum: 0
        type: integer
      readings_table_name:
        type: string
      topic:
        maxLength: 50
        type: string
      value_mapping:
        type: object
    required:
    - code
    - column_schema
    - payload_format
    - readings_table_name
    - topic
    type: object
  domain.ValidationErrorResponse:
    properties:
      errors:
        additionalProperties:
          type: string
        type: object
    type: object
host: localhost:3030
info:
  contact: {}
  description: API for management of IoT system database
  title: IOT nonna core API
  version: "1.0"
